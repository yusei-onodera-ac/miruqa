<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ようこそ</title>
<style>
  body { font-family: sans-serif; max-width: 520px; margin: 40px auto; color: #333; }
  input[type=text], input[type=password] { display: block; margin: 8px 0; padding: 6px; width: 100%; box-sizing: border-box; }
  button { padding: 8px 16px; margin-right: 8px; }
  .muted { color: #bbb; font-size: 12px; }
</style>
</head>
<body>
<h1>ようこそ</h1>
<p>当サービスをご利用いただくには、以下をご記入ください。</p>
<a href="#" class="muted">ヘルプ</a>

<form id="f">
  <input type="text" id="a" placeholder="こちら">
  <input type="text" id="b" placeholder="連絡先">
  <input type="password" id="c">
  <label><input type="checkbox" id="agree"> 同意</label>
  <div style="margin-top:12px">
    <button type="submit">実行</button>
    <button type="button" id="reset">戻る</button>
  </div>
</form>

<script>
  const f = document.getElementById('f');
  document.getElementById('reset').addEventListener('click', () => f.reset());
  f.addEventListener('submit', (e) => {
    e.preventDefault();
    const ok = document.getElementById('a').value.trim()
      && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(document.getElementById('b').value)
      && document.getElementById('c').value.length >= 8
      && document.getElementById('agree').checked;
    if (ok) {
      document.body.innerHTML = '<h1>受付済み</h1><p>ありがとうございました。</p>';
    }
  });
</script>
</body>
</html>
