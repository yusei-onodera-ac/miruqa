# テスト用: インメモリH2(実データのdata/app.mv.dbには触れない)。Flywayは本番と同じマイグレーションを適用する
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
worker.shared-secret=test-secret
mail.outbox-dir=./build/test-outbox
# v0.6 P3: テスト中はジョブキューの定期実行(@Scheduled)を止める(タイミング依存の不安定さを防ぐ。
# ジョブキュー自体のふるまいはJobQueueServiceTestがサービスを直接呼んで確認している)。
queue.scheduler-enabled=false
