spring.application.name=miruqa-web

# v0.7: サービス名。UI・模擬メール・規約類は、ここ(と GlobalModelAttributes 経由の
# ${productName})だけを見る。製品名をコードやテンプレートに直接書かない。
app.product-name=${PRODUCT_NAME:MiruQA}

# ワーカー(Python)のURL。Java層はこの設定値だけを持つ(APIキー等の秘密情報は持たない)。
# docs/contracts.md の「ワーカーAPI」参照。
worker.base-url=${WORKER_BASE_URL:http://127.0.0.1:8770}
# ワーカーが遅い/止まっているときに待たされすぎないための上限(FR-40)
worker.connect-timeout-ms=${WORKER_CONNECT_TIMEOUT_MS:3000}
# 仕様書のアップロード(POST /api/specs)はLLM抽出が同期で走るため、他より長めに待つ必要がある
worker.read-timeout-ms=${WORKER_READ_TIMEOUT_MS:20000}
worker.spec-upload-timeout-ms=${WORKER_SPEC_UPLOAD_TIMEOUT_MS:180000}
# Java層↔ワーカー間の共有秘密(v0.6 P1)。ワーカー(agent/config.py)と同じ値を環境変数で渡す。
# 秘密情報のためリポジトリにはコミットしない(値は.envのみ)。
worker.shared-secret=${WORKER_SHARED_SECRET:}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=${PORT:8080}

logging.level.ai.hack2026.web=INFO
# v0.6 P3(O-4): 構造化ログ。orgId/userId(OrgMdcInterceptor)・runId(JobQueueService等が個別に積む)を
# 各行に出す(MDCに無い場合は空欄になるだけで、ログ自体は壊れない)。
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [orgId=%X{orgId},userId=%X{userId},runId=%X{runId}] %logger{36} - %msg%n
# 開発中はテンプレートの変更を再起動なしで反映する(devtoolsは入れず、キャッシュ無効化だけで足りる)
spring.thymeleaf.cache=false

# --- v0.6 P1: DB(H2ファイルモード。ハッカソン規模を前提にした仮定) ---
# ファイルは web/data/ 配下(.gitignore対象)。テストはtestプロファイルでインメモリH2を使う。
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/app;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- v0.6 P1: 模擬メール(U-1)。本物のメール送信はしない。outbox/にファイル出力(.gitignore対象) ---
mail.outbox-dir=${MAIL_OUTBOX_DIR:./outbox}

# --- v0.6 P2(L-1): ドメイン所有確認。/.well-known/配下の確認用ファイル名に使うサービス名。
# sandbox-hostsは、名前解決チェック(SSRF対策)の対象外にする自作デモサイト用の明示的な例外(host[:port]、カンマ区切り) ---
domain-verification.service-name=${DOMAIN_VERIFICATION_SERVICE_NAME:miruqa}
domain-verification.sandbox-hosts=${DOMAIN_VERIFICATION_SANDBOX_HOSTS:127.0.0.1:8765}

# --- v0.6 P2(L-4): 拒否リスト。ワーカー側(agent/config.py)と同じ既定値を持つ(開発者からの指摘、2026-09-21) ---
denylist.hostname-suffixes=${DENYLIST_HOSTNAME_SUFFIXES:.go.jp,.lg.jp}
denylist.hostnames=${DENYLIST_HOSTNAMES:cyberace.co.jp,orcarouter.ai}

# --- v0.6 UIチェックポイント: runs/samples/をデモ組織へ登録し、実データでスクショを撮れるようにする
# (DemoDataSeeder)。既定OFF。本番の起動経路には影響しない。
# 使い方: SEED_DEMO_DATA=true mvn spring-boot:run(1回だけでよい。以後は通常起動) ---
app.seed-demo-data=${SEED_DEMO_DATA:false}

# --- v0.6 P3(O-1): ジョブキュー。組織ごとの同時実行数の上限(第0a章「同時実行は2件」)。
# 承認直後に空きがあれば即ディスパッチされる。無ければ、このポーリング間隔でスケジューラが拾う。
# run-timeout-secは仮の値(未測定。docs/pricing.mdの実測では最長532秒の診断があったため、
# 余裕を持たせて15分にした。実運用で見直すこと) ---
queue.max-concurrent-per-org=${QUEUE_MAX_CONCURRENT_PER_ORG:2}
queue.poll-interval-ms=${QUEUE_POLL_INTERVAL_MS:3000}
queue.run-timeout-sec=${QUEUE_RUN_TIMEOUT_SEC:900}

# --- v0.6 P3(O-3・B-3): 組織単位のコスト上限(日次・月次)。仮の値(未測定。docs/pricing.mdの
# 実測(1診断あたり$0.19〜$0.61)から、日次で5〜15診断分・月次で同程度の余裕を見て設定した。
# 事業側・プラン設計(P4)で見直すこと)。80%で警告(ブロックはしない)。 ---
usage.org-daily-limit-usd=${USAGE_ORG_DAILY_LIMIT_USD:3.0}
usage.org-monthly-limit-usd=${USAGE_ORG_MONTHLY_LIMIT_USD:30.0}
usage.warn-threshold=${USAGE_WARN_THRESHOLD:0.8}

# --- v0.7 P4(縮小): プラン名の表示のみ(実際の課金・プラン切替機能は作らない。内部記録のみ)。
# 日本語の既定値は、application.properties(.propertiesファイルの既定エンコーディングは
# ISO-8859-1で、UTF-8の日本語がここでは文字化けする)ではなく、DashboardControllerの
# @Value注釈側の既定値(javacはUTF-8でコンパイルする。pom.xmlのsourceEncoding参照)に持たせる。
# ここでは環境変数PLAN_NAMEの読み替えだけを行う(未設定ならアプリ側の既定値を使う) ---

# --- v0.7 P5: テスト用アカウント(ログインが必要な画面の点検)の暗号化鍵。Base64・32バイト。
# 未設定のときはCredentialEncryptionServiceがfail-closedになる(保存・復号とも例外)。
# 秘密情報のためリポジトリにはコミットしない(値は.envのみ、設計上の仮定) ---
credential.encryption-key=${CREDENTIAL_ENCRYPTION_KEY:}
