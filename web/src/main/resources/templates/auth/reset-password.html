<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'新しいパスワードの設定 | ' + ${productName}">新しいパスワードの設定 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <p class="v6-title" style="font-family:var(--v6-mono)" th:text="${productName}">MiruQA</p>
    <p class="v6-sub">新しいパスワードを設定してください。</p>

    <div class="v6-panel">
      <div th:if="${error}" class="v6-error" th:text="${error}"></div>
      <form method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}">
        <div class="v6-field">
          <label for="password">新しいパスワード(8文字以上)</label>
          <input type="password" id="password" name="password" minlength="8" required autofocus>
        </div>
        <button type="submit" class="v6-btn" style="width:100%">パスワードを変更する</button>
      </form>
    </div>
    <p class="v6-sub" style="margin-top:16px"><a th:href="@{/login}">ログインへ戻る</a></p>
  </div>
</body>
</html>
