<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'パスワードの再設定 | ' + ${productName}">パスワードの再設定 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <p class="v6-title" style="font-family:var(--v6-mono)" th:text="${productName}">MiruQA</p>
    <p class="v6-sub">登録済みのメールアドレスに、再設定用のリンクを送信します(模擬送信・ファイル出力)。</p>

    <div class="v6-panel">
      <div th:if="${message}" class="v6-note" th:text="${message}"></div>
      <form method="post" th:action="@{/forgot-password}">
        <div class="v6-field">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" name="email" required autofocus>
        </div>
        <button type="submit" class="v6-btn" style="width:100%">再設定リンクを送信</button>
      </form>
    </div>
    <p class="v6-sub" style="margin-top:16px"><a th:href="@{/login}">ログインへ戻る</a></p>
  </div>
</body>
</html>
