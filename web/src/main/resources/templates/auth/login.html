<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'ログイン | ' + ${productName}">ログイン | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <p class="v6-title" style="font-family:var(--v6-mono)" th:text="${productName}">MiruQA</p>
    <p class="v6-sub">仕様書とURLから、自律的にサイトを点検するツール</p>

    <div class="v6-panel">
      <div th:if="${param.error}" class="v6-error">メールアドレスまたはパスワードが違います。5回連続で失敗すると、15分間ログインできなくなります。</div>
      <div th:if="${param.logout}" class="v6-note">ログアウトしました。</div>
      <div th:if="${param.registered}" class="v6-note">登録しました。ログインしてください。</div>
      <div th:if="${param.emailVerified}" class="v6-note">メールアドレスを確認しました。</div>
      <div th:if="${param.passwordReset}" class="v6-note">パスワードを再設定しました。新しいパスワードでログインしてください。</div>

      <form method="post" th:action="@{/login}">
        <div class="v6-field">
          <label for="username">メールアドレス</label>
          <input type="email" id="username" name="username" required autofocus>
        </div>
        <div class="v6-field">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="v6-btn" style="width:100%">ログイン</button>
      </form>
    </div>
    <p class="v6-sub" style="margin-top:16px">アカウントをお持ちでない方は <a th:href="@{/signup}">新規登録</a></p>
    <p class="v6-sub">パスワードを忘れた場合は <a th:href="@{/forgot-password}">こちら</a></p>
  </div>
</body>
</html>
