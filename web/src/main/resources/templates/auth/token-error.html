<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="${title} + ' | ' + ${productName}">エラー | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <img src="/img/logo.png" th:alt="${productName}" style="height:32px;width:auto;display:block;margin-bottom:4px">
    <div class="v6-panel">
      <p class="v6-mark fail" th:text="${title}">エラー</p>
      <p class="v6-sub" th:text="${message}">リンクが無効です。</p>
      <a class="v6-btn" th:href="@{/login}">ログインへ戻る</a>
    </div>
  </div>
</body>
</html>
