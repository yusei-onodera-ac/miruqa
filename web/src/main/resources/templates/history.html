<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'履歴 | ' + ${productName}">履歴 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell">
    <div th:replace="~{fragments/shell :: header(current='history')}"></div>
    <p class="v6-title">実行履歴</p>
    <p class="v6-sub">このアカウントの組織で行った実行の一覧です。新しい順に表示しています。</p>

    <div class="v6-error" th:if="${workerError}">
      実行履歴を取得できませんでした。ワーカーが起動しているか確認し、再読み込みしてください。
    </div>

    <table class="v6-table" th:if="${not #lists.isEmpty(runs)}">
      <thead>
        <tr><th class="v6-nowrap">実行日時(JST)</th><th class="v6-nowrap">runId</th><th>対象</th><th class="v6-nowrap">Plan</th><th class="v6-nowrap">状態</th><th class="v6-nowrap">ステップ</th><th class="v6-nowrap">消費クレジット</th></tr>
      </thead>
      <tbody>
        <tr th:each="r : ${runs}" th:data-href="@{'/runs/' + ${r.runId}}">
          <td class="v6-mono v6-nowrap"><a th:href="@{'/runs/' + ${r.runId}}" th:text="${r.startedAtDisplay}"></a></td>
          <td class="v6-mono v6-nowrap" th:text="${r.runId}"></td>
          <td class="v6-mono url" th:text="${r.target}"></td>
          <td class="v6-mono v6-nowrap" th:text="${r.planId}"></td>
          <td class="v6-nowrap">
            <span th:replace="~{fragments/shell :: runStatusMark(${r.status})}"></span>
          </td>
          <td class="v6-mono v6-nowrap" th:text="${r.metrics != null ? r.metrics.steps : '-'}"></td>
          <td class="v6-mono v6-nowrap" th:text="${r.costDisplay}"></td>
        </tr>
      </tbody>
    </table>
    <div class="v6-empty" th:if="${#lists.isEmpty(runs) and not workerError}">
      まだ実行がありません。<a th:href="@{/projects}">プロジェクト</a>から診断を開始してください。
    </div>
  </div>
  <script>
    document.querySelectorAll("tr[data-href]").forEach(row => {
      row.addEventListener("click", () => { location.href = row.dataset.href; });
    });
  </script>
</body>
</html>
