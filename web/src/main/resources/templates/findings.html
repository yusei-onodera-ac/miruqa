<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="'不具合一覧 | ' + ${productName}">不具合一覧 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell">
    <div th:replace="~{fragments/shell :: header(current='findings')}"></div>
    <p class="v6-title">不具合一覧</p>
    <p class="v6-sub">直近の実行(最大30件走査)で見つかった指摘です。検出日の新しい順に表示しています。既定では「未対応」だけを表示します(対応済み・対応しないと記録した指摘は、再実行のたびに一覧を埋めないよう隠しています)。</p>

    <form method="get" th:action="@{/findings}" style="display:flex; gap:12px; margin-bottom:20px; flex-wrap:wrap">
      <div class="v6-field" style="margin-bottom:0">
        <label for="projectId">プロジェクト</label>
        <select id="projectId" name="projectId" onchange="this.form.submit()">
          <option value="">すべて</option>
          <option th:each="p : ${projects}" th:value="${p.id}" th:text="${p.name}"
                  th:selected="${filterProjectId != null and filterProjectId == p.id}"></option>
        </select>
      </div>
      <div class="v6-field" style="margin-bottom:0">
        <label for="severity">重大度</label>
        <select id="severity" name="severity" onchange="this.form.submit()">
          <option value="">すべて</option>
          <option value="High" th:selected="${filterSeverity == 'High'}">High</option>
          <option value="Med" th:selected="${filterSeverity == 'Med'}">Med</option>
          <option value="Low" th:selected="${filterSeverity == 'Low'}">Low</option>
        </select>
      </div>
      <div class="v6-field" style="margin-bottom:0">
        <label for="status">状態</label>
        <select id="status" name="status" onchange="this.form.submit()">
          <option value="ALL" th:selected="${filterStatus == 'ALL'}">すべて</option>
          <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                  th:selected="${filterStatus == s.name()}"></option>
        </select>
      </div>
    </form>

    <div class="v6-error" th:if="${workerError}">
      一部の実行結果を取得できませんでした。ワーカーへの接続を確認し、再読み込みしてください。
    </div>

    <table class="v6-table" th:if="${not #lists.isEmpty(findings)}">
      <thead>
        <tr><th class="v6-nowrap">検出日(JST)</th><th class="v6-nowrap">プロジェクト</th><th style="min-width:10em">観点</th><th class="v6-nowrap">重大度</th><th class="v6-nowrap">確度</th><th style="min-width:14em">タイトル</th><th class="v6-nowrap">実行</th><th class="v6-nowrap">状態</th></tr>
      </thead>
      <tbody>
        <tr th:each="f : ${findings}" th:data-href="@{'/runs/' + ${f.runId}}">
          <td class="v6-mono v6-nowrap" th:text="${f.detectedAtDisplay}"></td>
          <td class="v6-nowrap" th:text="${f.projectName}"></td>
          <td class="v6-mono" th:text="${f.perspective}"></td>
          <td class="v6-nowrap">
            <span class="v6-mark fail" th:if="${f.severity == 'High'}">High</span>
            <span class="v6-mark review" th:if="${f.severity == 'Med'}">Med</span>
            <span class="v6-mark info" th:if="${f.severity == 'Low'}">Low</span>
          </td>
          <td class="v6-nowrap">
            <span class="v6-mark pass" th:if="${f.confidence == 'confirmed'}">確認済み</span>
            <span class="v6-mark review" th:if="${f.confidence != 'confirmed'}">要確認</span>
          </td>
          <td th:text="${f.title}"></td>
          <td class="v6-mono v6-nowrap"><a th:href="@{'/runs/' + ${f.runId}}" th:text="${f.runId}"></a></td>
          <td class="v6-nowrap" onclick="event.stopPropagation()">
            <select class="finding-status-select" th:data-project-id="${f.projectId}" th:data-fingerprint="${f.fingerprint}">
              <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                      th:selected="${f.status == s.name()}"></option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
    <div class="v6-empty" th:if="${#lists.isEmpty(findings)}">
      条件に合う指摘がありません。
    </div>
  </div>
  <script>
    document.querySelectorAll("tr[data-href]").forEach(row => {
      row.addEventListener("click", () => { location.href = row.dataset.href; });
    });

    const csrfToken = document.querySelector('meta[name="_csrf"]').content;
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
    document.querySelectorAll(".finding-status-select").forEach(select => {
      select.addEventListener("change", async () => {
        const projectId = select.dataset.projectId;
        const fingerprint = select.dataset.fingerprint;
        const status = select.value;
        select.disabled = true;
        try {
          const params = new URLSearchParams({projectId, fingerprint, status});
          const res = await fetch("/findings/status", {
            method: "POST",
            headers: {"Content-Type": "application/x-www-form-urlencoded", [csrfHeader]: csrfToken},
            body: params.toString(),
          });
          if (!res.ok) {
            alert("状態の更新に失敗しました。再読み込みしてやり直してください。");
          }
        } catch (e) {
          alert("状態の更新に失敗しました(通信エラー)。再読み込みしてやり直してください。");
        } finally {
          select.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
