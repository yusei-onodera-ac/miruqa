<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'プロジェクトを作成 | ' + ${productName}">プロジェクトを作成 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell" style="max-width:720px">
    <div th:replace="~{fragments/shell :: header(current='projects')}"></div>
    <p class="v6-sub"><a th:href="@{/projects}">← プロジェクト一覧</a></p>
    <p class="v6-title">プロジェクトを作成</p>
    <p class="v6-sub">診断対象のサイト1つにつき、1プロジェクトを作成します。種類は作成後に変更できません。</p>
    <form method="post" th:action="@{/projects}">
      <div class="v6-field">
        <label>種類</label>
        <div style="display:flex; gap:12px; flex-wrap:wrap">
          <label class="v6-kind-option">
            <input type="radio" name="kind" value="DEV_ENV" checked style="width:auto">
            <div>
              <b>開発環境の点検</b>
              <p class="v6-sub" style="margin:4px 0 0">
                自分のローカル環境、または所有確認済みの公開ステージング。項目書の実施・能動テスト
                (承認つき)・ログイン後の画面・探索など、すべて行えます。
              </p>
            </div>
          </label>
          <label class="v6-kind-option">
            <input type="radio" name="kind" value="PUBLIC_READONLY" style="width:auto">
            <div>
              <b>公開ページの点検(読み取り専用)</b>
              <p class="v6-sub" style="margin:4px 0 0">
                任意の公開ページ。表示・文言・リンク切れ・アクセシビリティ・仕様書との照合だけを、
                閲覧のみで確認します。フォーム送信・ログイン・能動テストは行いません
                (GET以外の送信は遮断、robots.txtを尊重、低速化、名乗るUser-Agent、
                ボット検知・ログイン要求に当たったら中断)。
              </p>
            </div>
          </label>
        </div>
      </div>
      <div class="v6-field">
        <label for="name">プロジェクト名</label>
        <input type="text" id="name" name="name" th:value="${form.name}" placeholder="例: 自社ECサイト">
      </div>
      <div class="v6-field">
        <label for="targetUrl">対象URL</label>
        <input type="url" id="targetUrl" name="targetUrl" th:value="${form.targetUrl}" placeholder="https://example.com/" required>
      </div>
      <div class="v6-note">
        「開発環境の点検」で、対象がローカル・プライベートな場合は、開発中・リリース前のテスト
        環境であることの宣言だけで診断を開始できます。対象が公開ホストの場合は、所有確認が必要です。
        自律的な操作(注文確定などの重要な操作)の前には、いずれの種類でも必ず承認待ちになります。
      </div>
      <button type="submit" class="v6-btn">作成する</button>
    </form>
  </div>
</body>
</html>
