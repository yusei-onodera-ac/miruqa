<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'プロジェクト | ' + ${productName}">プロジェクト | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell">
    <div th:replace="~{fragments/shell :: header(current='projects')}"></div>
    <p class="v6-title">プロジェクト</p>
    <p class="v6-sub">診断対象のサイトごとに、仕様書・実行履歴をまとめます。</p>

    <div style="margin-bottom:16px"><a th:href="@{/projects/new}" class="v6-btn">プロジェクトを作成</a></div>

    <table class="v6-table" th:if="${not #lists.isEmpty(projects)}">
      <thead><tr><th>プロジェクト名</th><th>対象URL</th><th>作成日時</th></tr></thead>
      <tbody>
        <tr th:each="p : ${projects}" th:data-href="@{/projects/{id}(id=${p.id})}" style="cursor:pointer">
          <td th:text="${p.name}"></td>
          <td class="v6-mono url" th:text="${p.targetUrl}"></td>
          <td class="v6-mono" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
      </tbody>
    </table>
    <div class="v6-empty" th:if="${#lists.isEmpty(projects)}">
      プロジェクトがまだありません。「プロジェクトを作成」から、最初の診断対象を登録してください。
    </div>
  </div>
  <script>
    document.querySelectorAll("tr[data-href]").forEach(row => {
      row.addEventListener("click", () => { location.href = row.dataset.href; });
    });
  </script>
</body>
</html>
