<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title th:text="'クレジットをチャージ | ' + ${productName}">クレジットをチャージ | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <div th:replace="~{fragments/shell :: header(current='dashboard')}"></div>
    <p class="v6-title">クレジットをチャージ</p>
    <p class="v6-sub">現在の残高: <span class="v6-mono" th:text="${creditBalance} + 'cr'"></span></p>
    <p class="v6-mark review" style="display:inline-block; margin-bottom:12px">デモ環境: 実際の課金は発生しません</p>

    <div class="v6-panel">
      <div th:if="${error}" class="v6-error" th:text="${error}"></div>
      <form method="post" th:action="@{/credits/charge}" id="chargeForm">
        <input type="hidden" name="returnTo" th:if="${returnTo}" th:value="${returnTo}">
        <div class="v6-field">
          <label>チャージするパック</label>
          <div th:each="pack, iter : ${packs}" style="margin-bottom:8px">
            <label style="display:flex; gap:8px; align-items:flex-start; font-weight:400">
              <input type="radio" name="packId" th:value="${pack.id}" th:checked="${iter.first}" required style="margin-top:3px; flex-shrink:0">
              <span style="flex:1; min-width:0">
                <span th:text="${pack.yenAmount} + '円 → ' + ${pack.credits} + 'cr'"></span>
                <span class="v6-sub" th:if="${pack.bonusCredits() > 0}" th:text="'(ボーナス' + ${pack.bonusCredits()} + 'cr付き)'"></span>
              </span>
            </label>
          </div>
        </div>
        <div class="v6-field">
          <label for="cardNumber">カード番号</label>
          <input type="text" id="cardNumber" name="cardNumber" placeholder="4242 4242 4242 4242" autocomplete="off" required>
          <p class="v6-sub" style="margin-top:4px">テスト用: 4242 4242 4242 4242 のみ成功します。それ以外は拒否されるデモです。</p>
        </div>
        <div class="v6-field">
          <label for="expiry">有効期限(MM/YY)</label>
          <input type="text" id="expiry" name="expiry" placeholder="12/30" autocomplete="off" required>
        </div>
        <div class="v6-field">
          <label for="cardHolderName">カード名義</label>
          <input type="text" id="cardHolderName" name="cardHolderName" placeholder="TARO YAMADA" autocomplete="off" required>
        </div>
        <button type="submit" class="v6-btn" id="chargeSubmitBtn" style="width:100%">チャージする</button>
      </form>
    </div>
    <p class="v6-sub" style="margin-top:16px"><a th:href="@{/credits/history}">チャージ・消費の履歴を見る</a></p>
  </div>
  <script>
    document.getElementById("chargeForm").addEventListener("submit", function () {
      var btn = document.getElementById("chargeSubmitBtn");
      btn.disabled = true;
      btn.textContent = "処理中…";
    });
  </script>
</body>
</html>
