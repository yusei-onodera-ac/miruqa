<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'チャージ完了 | ' + ${productName}">チャージ完了 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell narrow">
    <div th:replace="~{fragments/shell :: header(current='dashboard')}"></div>
    <p class="v6-title">チャージが完了しました</p>
    <p class="v6-mark review" style="display:inline-block; margin-bottom:12px">デモ環境: 実際の課金は発生していません</p>

    <div class="v6-panel">
      <p class="v6-title" style="font-size:15px">領収書</p>
      <table class="v6-table">
        <tbody>
          <tr><th>領収番号</th><td class="v6-mono" th:text="${receiptNumber}"></td></tr>
          <tr><th>日時</th><td class="v6-mono" th:text="${receiptAt}"></td></tr>
          <tr><th>金額</th><td class="v6-mono" th:text="${yenAmount} + '円'"></td></tr>
          <tr><th>付与クレジット</th><td class="v6-mono" th:text="${creditsGranted} + 'cr'"></td></tr>
          <tr><th>チャージ後の残高</th><td class="v6-mono" th:text="${creditBalance} + 'cr'"></td></tr>
        </tbody>
      </table>
    </div>
    <div style="margin-top:16px" th:if="${returnTo}">
      <a class="v6-btn" th:href="${returnTo}">元の画面へ戻って実行する</a>
    </div>
    <p class="v6-sub" style="margin-top:16px">
      <a th:href="@{/dashboard}">ダッシュボードへ戻る</a> ・
      <a th:href="@{/credits/history}">履歴を見る</a>
    </p>
  </div>
</body>
</html>
