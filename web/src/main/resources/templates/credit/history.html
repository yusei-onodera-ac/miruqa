<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title th:text="'クレジットの履歴 | ' + ${productName}">クレジットの履歴 | MiruQA</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="v6">
  <div class="v6-shell">
    <div th:replace="~{fragments/shell :: header(current='dashboard')}"></div>
    <p class="v6-title">クレジットの履歴</p>
    <p class="v6-sub">現在の残高: <span class="v6-mono" th:text="${creditBalance} + 'cr'"></span>
      ・ <a th:href="@{/credits/charge}">チャージする</a></p>

    <table class="v6-table">
      <thead><tr><th class="v6-nowrap">日時</th><th>種別</th><th class="v6-nowrap">金額</th><th>詳細</th></tr></thead>
      <tbody>
        <tr th:if="${#lists.isEmpty(entries)}"><td colspan="4" class="v6-sub">まだ取引がありません。</td></tr>
        <tr th:each="e : ${entries}">
          <td class="v6-mono v6-nowrap" th:text="${e.createdAtDisplay}"></td>
          <td>
            <span class="v6-mark pass" th:if="${e.kind == 'charge'}">チャージ</span>
            <span class="v6-mark review" th:if="${e.kind == 'consume'}">消費</span>
            <span class="v6-mark info" th:if="${e.kind == 'refund'}">返金</span>
          </td>
          <td class="v6-mono v6-nowrap" th:text="${(e.amountCredits > 0 ? '+' : '') + e.amountCredits} + 'cr'"></td>
          <td>
            <span th:if="${e.kind == 'charge'}" th:text="${e.detail} + '(領収番号: ' + ${e.paymentReference} + ')'"></span>
            <span th:if="${e.kind == 'consume'}" class="v6-mono" th:text="${'run: ' + e.runId}"></span>
            <span th:if="${e.kind == 'refund'}" th:text="${e.detail}"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
